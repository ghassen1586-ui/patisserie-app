<form [formGroup]="paimentForm" (ngsubmit)="onSubmit()">

    <label>Credit Card Number:
        <input type="number" formControlName="ccn" 
        (input)="formatCard($event)"
        maxlength="19"
         placeholder="____-____-____-____"
        required>
        <br>
        CVV:
        <input type="number" formControlName="CVV"
        required
        >
        <br>
        Password(4 digits):
        <input type="number" formControlName="pinn"
        required
        >
        <br>
        <br>



    </label>


    <button type="submit">Confirm</button>





</form>
