<div class="panier-container">
  <h2>PANIER</h2>
  <hr>

  @for (cor of corns; track cor.id) {
    <div class="item">
      <img src="{{cor.link}}" alt="{{cor.name}}">
      <div class="info">
        <div class="name">{{cor.name}}</div>
        <div class="price">{{cor.price}} €</div>
      </div>
      <div class="quantity">{{productlist[cor.id - 1]}}</div>
      <div class="total">{{cor.price * productlist[cor.id - 1]}} €</div>
    </div>
  }
</div>
