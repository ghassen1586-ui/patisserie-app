<a routerLink="/">Home</a>

<form [formGroup]="liverisonform" (ngSubmit)="onSubmit()">

    <label >
        nom+prenome:
        <input type="text" 
        formControlName="nom"
        required>

    </label>
    <br>

    <label>
        Adresse:
        <input type="text" 
            formControlName="livraison.adresse"
            required>
    </label>
    <br>

    <label>
    City:
    <input type="text" 
           formControlName="livraison.ville">
  </label>
  <br>

    <label>
        Postal Code:
        <input type="text" 
           formControlName="livraison.codePostal">
    </label>
    <br>

    <label>
        Phone:
        <input type="text" 
        formControlName="livraison.telephone">
  </label>
  <br>

  <button type="submit">Confirm Delivery</button>

</form>
